<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ink — Markdown Renderer</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;0,700;1,400&family=JetBrains+Mono:wght@400;500&family=Outfit:wght@300;400;500;600&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/mermaid@11/dist/mermaid.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    <script>
        (function() {
            try {
                const savedTheme = localStorage.getItem('ink-theme');
                const prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
                const theme = savedTheme === 'dark' || savedTheme === 'light'
                    ? savedTheme
                    : (prefersDark ? 'dark' : 'light');
                document.documentElement.dataset.theme = theme;
            } catch (e) {
                document.documentElement.dataset.theme = 'light';
            }
        })();
    </script>
    <style>
        *, *::before, *::after {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            color-scheme: light;
            --ink: #1a1a1a;
            --paper: #faf8f5;
            --cream: #f5f2ed;
            --stone: #e8e4dd;
            --graphite: #6b6b6b;
            --rust: #c45c3e;
            --deep-rust: #9a3d25;
            --rust-soft: rgba(196, 92, 62, 0.08);
            --shadow-soft: rgba(26, 26, 26, 0.1);
            --code-block-bg: #1a1a1a;
            --code-block-text: #f5f2ed;
            --error-bg: #fdf3f3;
            --error-border: #d9534f;
            --error-text: #ffffff;
            --serif: 'Cormorant Garamond', Georgia, serif;
            --sans: 'Outfit', sans-serif;
            --mono: 'JetBrains Mono', monospace;
        }

        html[data-theme="dark"] {
            color-scheme: dark;
            --ink: #f1eee8;
            --paper: #11100f;
            --cream: #191715;
            --stone: #332f2b;
            --graphite: #b2aaa1;
            --rust: #e1785d;
            --deep-rust: #ff9a7f;
            --rust-soft: rgba(225, 120, 93, 0.16);
            --shadow-soft: rgba(0, 0, 0, 0.42);
            --code-block-bg: #080807;
            --code-block-text: #f4efe6;
            --error-bg: #2b1515;
            --error-border: #e16561;
            --error-text: #fff5f4;
        }

        html, body {
            height: 100%;
            background: var(--paper);
            color: var(--ink);
            font-family: var(--sans);
        }

        body {
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        /* Noise texture overlay */
        body::before {
            content: '';
            position: fixed;
            inset: 0;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)'/%3E%3C/svg%3E");
            opacity: 0.03;
            pointer-events: none;
            z-index: 1000;
        }

        /* Header */
        .header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 20px 32px;
            border-bottom: 1px solid var(--stone);
            background: var(--cream);
            flex-shrink: 0;
        }

        .logo {
            display: flex;
            align-items: baseline;
            gap: 12px;
        }

        .logo-mark {
            width: 32px;
            height: 32px;
            background: var(--ink);
            border-radius: 2px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--paper);
            font-family: var(--serif);
            font-weight: 700;
            font-size: 18px;
            font-style: italic;
        }

        .logo-text {
            font-family: var(--serif);
            font-size: 28px;
            font-weight: 600;
            letter-spacing: -0.02em;
            color: var(--ink);
        }

        .logo-sub {
            font-family: var(--sans);
            font-size: 11px;
            font-weight: 400;
            letter-spacing: 0.15em;
            text-transform: uppercase;
            color: var(--graphite);
        }

        .header-actions {
            display: flex;
            gap: 8px;
            align-items: center;
            flex-wrap: wrap;
        }

        .document-controls {
            display: flex;
            align-items: center;
            gap: 8px;
            padding-right: 8px;
            margin-right: 8px;
            border-right: 1px solid var(--stone);
        }

        .document-select-wrap {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .document-label {
            font-family: var(--sans);
            font-size: 9px;
            font-weight: 500;
            letter-spacing: 0.16em;
            text-transform: uppercase;
            color: var(--graphite);
        }

        .document-select {
            min-width: 220px;
            max-width: 280px;
            padding: 9px 12px;
            background: var(--paper);
            border: 1px solid var(--stone);
            border-radius: 4px;
            color: var(--ink);
            font-family: var(--sans);
            font-size: 12px;
            outline: none;
        }

        .document-select:focus {
            border-color: var(--rust);
        }

        .icon-action-btn {
            width: 42px;
            height: 42px;
            padding: 0;
            justify-content: center;
        }

        .icon-action-btn svg {
            width: 20px;
            height: 20px;
        }

        .action-btn {
            display: flex;
            align-items: center;
            gap: 6px;
            padding: 10px 16px;
            background: transparent;
            border: 1px solid var(--stone);
            border-radius: 4px;
            font-family: var(--sans);
            font-size: 12px;
            font-weight: 500;
            letter-spacing: 0.04em;
            color: var(--graphite);
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .action-btn:hover {
            background: var(--ink);
            border-color: var(--ink);
            color: var(--paper);
        }

        .action-btn svg {
            width: 15px;
            height: 15px;
            flex-shrink: 0;
            stroke-width: 2.2;
        }

        .action-btn.icon-action-btn svg {
            width: 20px;
            height: 20px;
        }

        #themeToggle svg {
            width: 19px;
            height: 19px;
            stroke-width: 2.3;
        }

        /* Popover menus */
        .menu-wrap {
            position: relative;
        }

        .menu-trigger[aria-expanded="true"] {
            background: var(--ink);
            border-color: var(--ink);
            color: var(--paper);
        }

        .menu-panel {
            position: absolute;
            top: calc(100% + 6px);
            right: 0;
            min-width: 180px;
            background: var(--paper);
            border: 1px solid var(--stone);
            border-radius: 4px;
            box-shadow: 0 12px 32px var(--shadow-soft);
            padding: 4px;
            display: none;
            flex-direction: column;
            z-index: 30;
        }

        .menu-wrap.open .menu-panel {
            display: flex;
        }

        .menu-item {
            appearance: none;
            background: transparent;
            border: none;
            text-align: left;
            padding: 9px 12px;
            font-family: var(--sans);
            font-size: 12px;
            font-weight: 500;
            letter-spacing: 0.02em;
            color: var(--ink);
            border-radius: 3px;
            cursor: pointer;
            transition: background 0.15s ease, color 0.15s ease;
        }

        .menu-item:hover {
            background: var(--ink);
            color: var(--paper);
        }

        .menu-item.destructive {
            color: var(--deep-rust);
        }

        .menu-item.destructive:hover {
            background: var(--deep-rust);
            color: var(--paper);
        }

        /* Main container */
        .main {
            flex: 1;
            display: grid;
            grid-template-columns: 1fr 1fr;
            min-height: 0;
        }

        /* Editor panel */
        .editor-panel {
            display: flex;
            flex-direction: column;
            background: var(--cream);
            border-right: 1px solid var(--stone);
            position: relative;
        }

        .panel-label {
            position: absolute;
            top: 24px;
            left: 24px;
            font-family: var(--sans);
            font-size: 9px;
            font-weight: 500;
            letter-spacing: 0.2em;
            text-transform: uppercase;
            color: var(--graphite);
            opacity: 0.6;
            z-index: 10;
        }

        .panel-label::after {
            content: '';
            display: block;
            width: 24px;
            height: 1px;
            background: var(--rust);
            margin-top: 8px;
        }

        textarea {
            flex: 1;
            padding: 64px 32px 32px;
            border: none;
            background: transparent;
            font-family: var(--mono);
            font-size: 13px;
            line-height: 1.8;
            color: var(--ink);
            resize: none;
            outline: none;
        }

        textarea::placeholder {
            color: var(--graphite);
            opacity: 0.4;
        }

        /* Preview panel */
        .preview-panel {
            display: flex;
            flex-direction: column;
            background: var(--paper);
            position: relative;
            overflow: hidden;
        }

        .preview-panel .panel-label {
            right: 24px;
            left: auto;
            text-align: right;
        }

        .preview-panel .panel-label::after {
            margin-left: auto;
        }

        /* Corner decorations */
        .corner-decor {
            position: absolute;
            width: 48px;
            height: 48px;
            border: 1px solid var(--stone);
            opacity: 0.4;
        }

        .corner-decor.top-left {
            top: 16px;
            left: 16px;
            border-right: none;
            border-bottom: none;
        }

        .corner-decor.bottom-right {
            bottom: 16px;
            right: 16px;
            border-left: none;
            border-top: none;
        }

        #preview {
            flex: 1;
            overflow-y: auto;
            padding: 64px 48px 48px;
            line-height: 1.9;
        }

        /* Scrollbar */
        #preview::-webkit-scrollbar {
            width: 8px;
        }

        #preview::-webkit-scrollbar-track {
            background: var(--cream);
        }

        #preview::-webkit-scrollbar-thumb {
            background: var(--stone);
            border-radius: 4px;
        }

        #preview::-webkit-scrollbar-thumb:hover {
            background: var(--graphite);
        }

        /* Markdown preview styles */
        #preview h1 {
            font-family: var(--serif);
            font-size: 3em;
            font-weight: 700;
            color: var(--ink);
            margin: 0 0 0.5em;
            letter-spacing: -0.03em;
            line-height: 1.1;
        }

        #preview h1::first-letter {
            font-size: 1.15em;
            color: var(--rust);
        }

        #preview h2 {
            font-family: var(--serif);
            font-size: 1.75em;
            font-weight: 600;
            color: var(--ink);
            margin: 2em 0 0.75em;
            padding-bottom: 0.5em;
            border-bottom: 1px solid var(--stone);
            letter-spacing: -0.01em;
        }

        #preview h3 {
            font-family: var(--sans);
            font-size: 1.1em;
            font-weight: 600;
            color: var(--ink);
            margin: 1.75em 0 0.75em;
            letter-spacing: 0.02em;
        }

        #preview h4, #preview h5, #preview h6 {
            font-family: var(--sans);
            font-size: 0.9em;
            font-weight: 600;
            color: var(--graphite);
            margin: 1.5em 0 0.5em;
            letter-spacing: 0.08em;
            text-transform: uppercase;
        }

        #preview p {
            font-family: var(--serif);
            font-size: 1.15em;
            color: var(--ink);
            margin: 1em 0;
            text-align: justify;
            hyphens: auto;
        }

        #preview a {
            color: var(--rust);
            text-decoration: none;
            border-bottom: 1px solid currentColor;
            transition: all 0.2s;
        }

        #preview a:hover {
            color: var(--deep-rust);
            background: var(--rust-soft);
        }

        #preview code {
            font-family: var(--mono);
            font-size: 0.85em;
            background: var(--cream);
            padding: 3px 8px;
            border-radius: 3px;
            color: var(--deep-rust);
            border: 1px solid var(--stone);
        }

        #preview pre {
            background: var(--code-block-bg);
            color: var(--code-block-text);
            padding: 24px;
            border-radius: 4px;
            overflow-x: auto;
            margin: 1.5em 0;
            line-height: 1.6;
            position: relative;
        }

        #preview pre::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 3px;
            background: linear-gradient(90deg, var(--rust) 0%, var(--deep-rust) 100%);
        }

        #preview pre code {
            background: none;
            color: inherit;
            padding: 0;
            border: none;
            font-size: 0.9em;
        }

        #preview blockquote {
            font-family: var(--serif);
            font-style: italic;
            font-size: 1.2em;
            color: var(--graphite);
            border-left: 3px solid var(--rust);
            padding: 0.5em 0 0.5em 24px;
            margin: 1.5em 0;
            position: relative;
        }

        #preview blockquote::before {
            content: '"';
            position: absolute;
            left: 24px;
            top: -10px;
            font-size: 4em;
            color: var(--stone);
            font-family: var(--serif);
            line-height: 1;
        }

        #preview blockquote p {
            position: relative;
            z-index: 1;
        }

        #preview ul, #preview ol {
            margin: 1em 0;
            padding-left: 1.5em;
        }

        #preview li {
            font-family: var(--serif);
            font-size: 1.1em;
            margin: 0.5em 0;
            color: var(--ink);
        }

        #preview li::marker {
            color: var(--rust);
        }

        #preview strong {
            font-weight: 700;
            color: var(--ink);
        }

        #preview em {
            font-style: italic;
            color: var(--graphite);
        }

        #preview img {
            max-width: 100%;
            height: auto;
            border-radius: 4px;
            margin: 1.5em 0;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
        }

        #preview table {
            width: 100%;
            border-collapse: collapse;
            margin: 1.5em 0;
            font-family: var(--sans);
            font-size: 0.9em;
        }

        #preview table th {
            background: var(--cream);
            padding: 14px 16px;
            text-align: left;
            font-weight: 600;
            border-bottom: 2px solid var(--ink);
            color: var(--ink);
            letter-spacing: 0.02em;
        }

        #preview table td {
            padding: 14px 16px;
            border-bottom: 1px solid var(--stone);
            color: var(--ink);
        }

        #preview table tr:hover td {
            background: var(--cream);
        }

        #preview hr {
            border: none;
            height: 1px;
            background: linear-gradient(90deg, transparent, var(--stone), transparent);
            margin: 3em 0;
            position: relative;
        }

        #preview hr::before {
            content: '§';
            position: absolute;
            left: 50%;
            top: 50%;
            transform: translate(-50%, -50%);
            background: var(--paper);
            padding: 0 16px;
            font-family: var(--serif);
            font-size: 1.2em;
            color: var(--graphite);
        }

        .mermaid-diagram {
            margin: 1.5em 0;
            text-align: center;
            overflow-x: auto;
            padding: 24px;
            background: var(--cream);
            border-radius: 4px;
        }

        .mermaid-diagram svg {
            max-width: 100%;
            height: auto;
        }

        .mermaid-error {
            margin: 1.5em 0;
            border: 1px solid var(--error-border);
            border-radius: 4px;
            background: var(--error-bg);
            overflow: hidden;
        }

        .mermaid-error-msg {
            padding: 10px 14px;
            background: var(--error-border);
            color: var(--error-text);
            font-family: var(--serif);
            font-size: 0.95em;
        }

        .mermaid-error pre {
            margin: 0;
            padding: 12px 14px;
            background: transparent;
            border: none;
            white-space: pre-wrap;
            word-break: break-word;
            color: var(--graphite);
            font-size: 0.85em;
        }

        /* Empty state */
        #preview:empty::before {
            content: 'Your rendered markdown will appear here...';
            font-family: var(--serif);
            font-style: italic;
            color: var(--graphite);
            opacity: 0.4;
        }

        /* Panel expand buttons */
        .panel-expand {
            position: absolute;
            top: 20px;
            right: 20px;
            width: 32px;
            height: 32px;
            background: var(--paper);
            border: 1px solid var(--stone);
            border-radius: 4px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            color: var(--graphite);
            transition: all 0.2s;
            z-index: 20;
        }

        .panel-expand:hover {
            background: var(--ink);
            border-color: var(--ink);
            color: var(--paper);
        }

        .panel-expand svg {
            width: 14px;
            height: 14px;
        }

        .editor-panel .panel-expand {
            background: var(--cream);
        }

        /* Fullscreen modes */
        body.editor-fullscreen .preview-panel,
        body.preview-fullscreen .editor-panel {
            display: none;
        }

        body.editor-fullscreen .editor-panel,
        body.preview-fullscreen .preview-panel {
            grid-column: 1 / -1;
        }

        body.editor-fullscreen .header,
        body.preview-fullscreen .header {
            display: none;
        }

        body.editor-fullscreen,
        body.preview-fullscreen {
            overflow: auto;
        }

        body.editor-fullscreen .main,
        body.preview-fullscreen .main {
            grid-template-columns: 1fr;
            height: 100vh;
        }

        body.editor-fullscreen .editor-panel {
            border-right: none;
        }

        /* Responsive */
        @media (max-width: 900px) {
            .main {
                grid-template-columns: 1fr;
            }

            .editor-panel {
                border-right: none;
                border-bottom: 1px solid var(--stone);
                min-height: 40vh;
            }

            .preview-panel {
                min-height: 50vh;
            }

            .header {
                flex-direction: column;
                gap: 16px;
                align-items: flex-start;
            }

            .header-actions {
                flex-wrap: wrap;
            }

            .document-controls {
                width: 100%;
                padding-right: 0;
                margin-right: 0;
                border-right: none;
            }

            .document-select-wrap {
                flex: 1;
            }

            .document-select {
                width: 100%;
                max-width: none;
                min-width: 0;
            }
        }

        /* Animation */
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(8px); }
            to { opacity: 1; transform: translateY(0); }
        }

        #preview > * {
            animation: fadeIn 0.3s ease-out;
        }

        /* Mobile block */
        .mobile-block { display: none; }
        @media (max-width: 600px) {
            .mobile-block {
                display: flex;
                position: fixed;
                inset: 0;
                z-index: 9999;
                align-items: center;
                justify-content: center;
                background: var(--paper);
                color: var(--ink);
                padding: 40px 28px;
                text-align: center;
                font-family: var(--serif);
                font-size: 32px;
                font-style: italic;
                font-weight: 600;
                line-height: 1.3;
            }
            .mobile-block::after {
                content: '';
                position: absolute;
                bottom: 48px;
                left: 50%;
                transform: translateX(-50%);
                width: 32px;
                height: 2px;
                background: var(--rust);
            }
            body > *:not(.mobile-block) { display: none !important; }
        }
    </style>
</head>
<body>
    <div class="mobile-block">I don't want you using this on the phone</div>
    <header class="header">
        <div class="logo">
            <div class="logo-mark">I</div>
            <div>
                <div class="logo-text">Ink</div>
                <div class="logo-sub">Markdown Renderer</div>
            </div>
        </div>
        <div class="header-actions">
            <div class="document-controls">
                <label class="document-select-wrap" for="documentSelect">
                    <span class="document-label">Draft</span>
                    <select class="document-select" id="documentSelect" onchange="switchDocument(this.value)"></select>
                </label>
                <button class="action-btn icon-action-btn" onclick="createDocument()" title="New draft" aria-label="New draft">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M12 5v14M5 12h14"/>
                    </svg>
                </button>
                <div class="menu-wrap" data-menu="draft">
                    <button class="action-btn icon-action-btn menu-trigger" onclick="toggleMenu('draft')" title="More draft actions" aria-label="More draft actions" aria-haspopup="true" aria-expanded="false">
                        <svg viewBox="0 0 24 24" fill="currentColor">
                            <circle cx="5" cy="12" r="2"/>
                            <circle cx="12" cy="12" r="2"/>
                            <circle cx="19" cy="12" r="2"/>
                        </svg>
                    </button>
                    <div class="menu-panel" role="menu">
                        <button class="menu-item" role="menuitem" onclick="runMenuAction(renameDocument)">Rename</button>
                        <button class="menu-item" role="menuitem" onclick="runMenuAction(duplicateDocument)">Duplicate</button>
                        <button class="menu-item destructive" role="menuitem" onclick="runMenuAction(deleteDocument)">Delete</button>
                    </div>
                </div>
            </div>
            <button class="action-btn icon-action-btn" id="themeToggle" onclick="toggleTheme()" title="Switch to dark mode" aria-label="Switch to dark mode" aria-pressed="false">
                <svg class="theme-icon theme-icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" aria-hidden="true">
                    <path d="M20.5 14.5A8.5 8.5 0 1 1 9.5 3.5A7 7 0 0 0 20.5 14.5Z"/>
                </svg>
                <svg class="theme-icon theme-icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" aria-hidden="true" hidden>
                    <circle cx="12" cy="12" r="5"/>
                    <path d="M12 1v3M12 20v3M4.2 4.2l2.1 2.1M17.7 17.7l2.1 2.1M1 12h3M20 12h3M4.2 19.8l2.1-2.1M17.7 6.3l2.1-2.1"/>
                </svg>
            </button>
            <div class="menu-wrap" data-menu="export">
                <button class="action-btn menu-trigger" onclick="toggleMenu('export')" aria-haspopup="true" aria-expanded="false">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
                        <polyline points="7 10 12 15 17 10"/>
                        <line x1="12" y1="15" x2="12" y2="3"/>
                    </svg>
                    Export
                </button>
                <div class="menu-panel" role="menu">
                    <button class="menu-item" role="menuitem" onclick="runMenuAction(exportMD)">Markdown (.md)</button>
                    <button class="menu-item" role="menuitem" onclick="runMenuAction(exportHTML)">HTML</button>
                    <button class="menu-item" role="menuitem" onclick="runMenuAction(exportPDF)">PDF</button>
                </div>
            </div>
        </div>
    </header>

    <main class="main">
        <div class="editor-panel">
            <span class="panel-label">Input</span>
            <button class="panel-expand" onclick="toggleFullscreen('editor')" title="Toggle fullscreen">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M15 3h6v6M9 21H3v-6M21 3l-7 7M3 21l7-7"/>
                </svg>
            </button>
            <textarea id="markdown" placeholder="Start typing your markdown here...

# Welcome to Ink

A beautiful markdown renderer with an editorial aesthetic.

## Features

- **Live preview** as you type
- Support for *italic*, **bold**, and `code`
- Mermaid diagrams
- Export to MD, HTML, or PDF

> 'The details are not the details. They make the design.'
> — Charles Eames"></textarea>
        </div>
        <div class="preview-panel">
            <span class="panel-label">Preview</span>
            <button class="panel-expand" onclick="toggleFullscreen('preview')" title="Toggle fullscreen">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M15 3h6v6M9 21H3v-6M21 3l-7 7M3 21l7-7"/>
                </svg>
            </button>
            <div class="corner-decor top-left"></div>
            <div class="corner-decor bottom-right"></div>
            <div id="preview"></div>
        </div>
    </main>

    <script>
        const textarea = document.getElementById('markdown');
        const preview = document.getElementById('preview');
        const documentSelect = document.getElementById('documentSelect');
        const themeToggle = document.getElementById('themeToggle');

        const THEME_STORAGE_KEY = 'ink-theme';
        let mermaidIdCounter = 0;
        let docsIndex = [];
        let activeDocId = null;

        const LEGACY_STORAGE_KEY = 'ink-markdown-content';
        const DOCS_INDEX_KEY = 'ink-docs-index';
        const ACTIVE_DOC_KEY = 'ink-active-doc-id';
        const DOC_KEY_PREFIX = 'ink-doc-';
        const PREVIEW_RENDER_DEBOUNCE_MS = 700;
        const PREVIEW_RENDER_MAX_WAIT_MS = 5000;

        let previewRenderTimer = null;
        let previewRenderMaxTimer = null;
        let lastRenderedMarkdown = null;
        let renderSequence = 0;

        function getCurrentTheme() {
            return document.documentElement.dataset.theme === 'dark' ? 'dark' : 'light';
        }

        function getMermaidTheme() {
            return getCurrentTheme() === 'dark' ? 'dark' : 'neutral';
        }

        function configureMermaid() {
            mermaid.initialize({ startOnLoad: false, theme: getMermaidTheme() });
        }

        function updateThemeToggle() {
            if (!themeToggle) return;
            const isDark = getCurrentTheme() === 'dark';
            const nextThemeLabel = isDark ? 'light' : 'dark';
            themeToggle.setAttribute('aria-pressed', String(isDark));
            themeToggle.setAttribute('aria-label', 'Switch to ' + nextThemeLabel + ' mode');
            themeToggle.title = 'Switch to ' + nextThemeLabel + ' mode';
            const moon = themeToggle.querySelector('.theme-icon-moon');
            const sun = themeToggle.querySelector('.theme-icon-sun');
            if (moon) moon.hidden = isDark;
            if (sun) sun.hidden = !isDark;
        }

        function setTheme(theme, options) {
            const nextTheme = theme === 'dark' ? 'dark' : 'light';
            const shouldRender = options && options.render;
            document.documentElement.dataset.theme = nextTheme;
            try {
                localStorage.setItem(THEME_STORAGE_KEY, nextTheme);
            } catch (e) {
                console.warn('Failed to save theme preference:', e);
            }
            updateThemeToggle();
            configureMermaid();
            if (shouldRender) renderMarkdown({ force: true });
        }

        function toggleTheme() {
            setTheme(getCurrentTheme() === 'dark' ? 'light' : 'dark', { render: true });
        }

        configureMermaid();
        updateThemeToggle();

        function cleanupMermaidStragglers() {
            // Mermaid appends a measurement container `<div id="d{id}">` (and an
            // `<svg id="{id}">`) to <body> while rendering. On parse/render failure
            // it doesn't clean them up, leaving the user with visible "Syntax error
            // in text" SVGs that accumulate across re-renders.
            document.querySelectorAll('body > div[id^="dmermaid-"]').forEach(el => el.remove());
            document.querySelectorAll('body > svg[id^="mermaid-"]').forEach(el => el.remove());
        }

        async function renderMarkdown(options) {
            const force = options && options.force;
            const markdown = textarea.value;
            if (!force && markdown === lastRenderedMarkdown) return;

            lastRenderedMarkdown = markdown;
            const currentRender = ++renderSequence;
            preview.innerHTML = marked.parse(markdown);
            cleanupMermaidStragglers();
            const mermaidBlocks = preview.querySelectorAll('pre code.language-mermaid');
            for (const block of mermaidBlocks) {
                if (currentRender !== renderSequence) return;
                const code = block.textContent;
                const id = 'mermaid-' + (++mermaidIdCounter);
                try {
                    const { svg } = await mermaid.render(id, code);
                    if (currentRender !== renderSequence) return;
                    const div = document.createElement('div');
                    div.className = 'mermaid-diagram';
                    div.innerHTML = svg;
                    block.parentElement.replaceWith(div);
                } catch (e) {
                    console.error('Mermaid render error:', e);
                    const errDiv = document.createElement('div');
                    errDiv.className = 'mermaid-error';
                    const msgDiv = document.createElement('div');
                    msgDiv.className = 'mermaid-error-msg';
                    const firstLine = (e && e.message ? String(e.message) : String(e)).split('\n')[0];
                    msgDiv.textContent = 'Mermaid: ' + firstLine;
                    const pre = document.createElement('pre');
                    pre.textContent = code;
                    errDiv.appendChild(msgDiv);
                    errDiv.appendChild(pre);
                    block.parentElement.replaceWith(errDiv);
                } finally {
                    cleanupMermaidStragglers();
                }
            }
        }

        function clearPreviewRenderTimers() {
            if (previewRenderTimer) {
                clearTimeout(previewRenderTimer);
                previewRenderTimer = null;
            }
            if (previewRenderMaxTimer) {
                clearTimeout(previewRenderMaxTimer);
                previewRenderMaxTimer = null;
            }
        }

        function flushPreviewRender() {
            clearPreviewRenderTimers();
            return renderMarkdown();
        }

        function schedulePreviewRender() {
            if (previewRenderTimer) clearTimeout(previewRenderTimer);

            previewRenderTimer = setTimeout(function() {
                previewRenderTimer = null;
                if (previewRenderMaxTimer) {
                    clearTimeout(previewRenderMaxTimer);
                    previewRenderMaxTimer = null;
                }
                renderMarkdown();
            }, PREVIEW_RENDER_DEBOUNCE_MS);

            if (!previewRenderMaxTimer) {
                previewRenderMaxTimer = setTimeout(function() {
                    if (previewRenderTimer) {
                        clearTimeout(previewRenderTimer);
                        previewRenderTimer = null;
                    }
                    previewRenderMaxTimer = null;
                    renderMarkdown();
                }, PREVIEW_RENDER_MAX_WAIT_MS);
            }
        }

        // Fullscreen toggle
        function toggleFullscreen(panel) {
            const editorClass = 'editor-fullscreen';
            const previewClass = 'preview-fullscreen';

            if (panel === 'editor') {
                document.body.classList.remove(previewClass);
                document.body.classList.toggle(editorClass);
            } else {
                document.body.classList.remove(editorClass);
                document.body.classList.toggle(previewClass);
            }
        }

        // Popover menus (export, draft actions)
        function closeAllMenus() {
            document.querySelectorAll('.menu-wrap.open').forEach(wrap => {
                wrap.classList.remove('open');
                const trigger = wrap.querySelector('.menu-trigger');
                if (trigger) trigger.setAttribute('aria-expanded', 'false');
            });
        }

        function toggleMenu(name) {
            const wrap = document.querySelector('.menu-wrap[data-menu="' + name + '"]');
            if (!wrap) return;
            const willOpen = !wrap.classList.contains('open');
            closeAllMenus();
            if (willOpen) {
                wrap.classList.add('open');
                const trigger = wrap.querySelector('.menu-trigger');
                if (trigger) trigger.setAttribute('aria-expanded', 'true');
            }
        }

        function runMenuAction(fn) {
            closeAllMenus();
            fn();
        }

        document.addEventListener('click', function(e) {
            if (!e.target.closest('.menu-wrap')) closeAllMenus();
        });

        // Escape closes menus and exits fullscreen
        document.addEventListener('keydown', function(e) {
            if (e.key === 'Escape') {
                closeAllMenus();
                document.body.classList.remove('editor-fullscreen', 'preview-fullscreen');
            }
        });

        function nowIso() {
            return new Date().toISOString();
        }

        function createDocumentId() {
            if (window.crypto && crypto.randomUUID) {
                return crypto.randomUUID();
            }
            return Date.now().toString(36) + '-' + Math.random().toString(36).slice(2);
        }

        function docKey(id) {
            return DOC_KEY_PREFIX + id;
        }

        function formatUpdatedAt(value) {
            const date = new Date(value);
            if (Number.isNaN(date.getTime())) return 'unsaved';
            return date.toLocaleString([], {
                month: 'short',
                day: 'numeric',
                hour: '2-digit',
                minute: '2-digit'
            });
        }

        function readDocsIndex() {
            try {
                const parsed = JSON.parse(localStorage.getItem(DOCS_INDEX_KEY) || '[]');
                if (Array.isArray(parsed)) {
                    return parsed.filter(doc => doc && doc.id && doc.title && doc.updatedAt);
                }
            } catch (e) {
                console.warn('Failed to read document index:', e);
            }
            return [];
        }

        function writeDocsIndex() {
            localStorage.setItem(DOCS_INDEX_KEY, JSON.stringify(docsIndex));
        }

        function getActiveDoc() {
            return docsIndex.find(doc => doc.id === activeDocId) || null;
        }

        function getDocumentContent(id) {
            return localStorage.getItem(docKey(id)) || '';
        }

        function setActiveDocument(id) {
            activeDocId = id;
            localStorage.setItem(ACTIVE_DOC_KEY, id);
        }

        function sortDocs() {
            docsIndex.sort((a, b) => new Date(b.updatedAt) - new Date(a.updatedAt));
        }

        function renderDocumentSelect() {
            documentSelect.innerHTML = '';
            sortDocs();
            docsIndex.forEach(doc => {
                const option = document.createElement('option');
                option.value = doc.id;
                option.textContent = doc.title + ' - ' + formatUpdatedAt(doc.updatedAt);
                documentSelect.appendChild(option);
            });
            documentSelect.value = activeDocId;
        }

        function createDocumentRecord(title, content) {
            const doc = {
                id: createDocumentId(),
                title: title || 'Untitled',
                updatedAt: nowIso()
            };
            docsIndex.unshift(doc);
            localStorage.setItem(docKey(doc.id), content || '');
            writeDocsIndex();
            return doc;
        }

        function migrateLegacyDocument() {
            const legacy = localStorage.getItem(LEGACY_STORAGE_KEY);
            if (legacy !== null && docsIndex.length === 0) {
                const migrated = createDocumentRecord('Untitled', legacy);
                localStorage.removeItem(LEGACY_STORAGE_KEY);
                setActiveDocument(migrated.id);
                return true;
            }
            if (legacy !== null) {
                localStorage.removeItem(LEGACY_STORAGE_KEY);
            }
            return false;
        }

        function saveToStorage() {
            if (!activeDocId) return;
            try {
                localStorage.setItem(docKey(activeDocId), textarea.value);
                const doc = getActiveDoc();
                if (doc) {
                    doc.updatedAt = nowIso();
                    writeDocsIndex();
                    renderDocumentSelect();
                }
            } catch (e) {
                console.warn('Failed to save to localStorage:', e);
            }
        }

        function loadFromStorage() {
            docsIndex = readDocsIndex();
            migrateLegacyDocument();

            if (docsIndex.length === 0) {
                const doc = createDocumentRecord('Untitled', '');
                setActiveDocument(doc.id);
            } else {
                const savedActiveId = localStorage.getItem(ACTIVE_DOC_KEY);
                const activeExists = docsIndex.some(doc => doc.id === savedActiveId);
                setActiveDocument(activeExists ? savedActiveId : docsIndex[0].id);
            }

            textarea.value = getDocumentContent(activeDocId);
            renderDocumentSelect();
            return true;
        }

        function switchDocument(id) {
            if (!id || id === activeDocId) return;
            flushPendingSave();
            clearPreviewRenderTimers();
            setActiveDocument(id);
            textarea.value = getDocumentContent(activeDocId);
            renderDocumentSelect();
            renderMarkdown({ force: true });
            textarea.focus();
        }

        function createDocument() {
            flushPendingSave();
            const title = prompt('Name this draft:', 'Untitled');
            if (title === null) return;
            const doc = createDocumentRecord(title.trim() || 'Untitled', '');
            setActiveDocument(doc.id);
            textarea.value = '';
            renderDocumentSelect();
            clearPreviewRenderTimers();
            renderMarkdown({ force: true });
            textarea.focus();
        }

        function renameDocument() {
            const doc = getActiveDoc();
            if (!doc) return;
            const title = prompt('Rename this draft:', doc.title);
            if (title === null) return;
            const nextTitle = title.trim();
            if (!nextTitle) return;
            doc.title = nextTitle;
            doc.updatedAt = nowIso();
            writeDocsIndex();
            renderDocumentSelect();
        }

        function duplicateDocument() {
            const doc = getActiveDoc();
            if (!doc) return;
            flushPendingSave();
            const copy = createDocumentRecord(doc.title + ' Copy', textarea.value);
            setActiveDocument(copy.id);
            renderDocumentSelect();
            clearPreviewRenderTimers();
            renderMarkdown({ force: true });
            textarea.focus();
        }

        function deleteDocument() {
            const doc = getActiveDoc();
            if (!doc) return;
            if (docsIndex.length === 1) {
                if (!confirm('Delete this draft and start a new empty one?')) return;
                localStorage.removeItem(docKey(doc.id));
                docsIndex = [];
                const replacement = createDocumentRecord('Untitled', '');
                setActiveDocument(replacement.id);
                textarea.value = '';
            } else {
                if (!confirm('Delete "' + doc.title + '"?')) return;
                const deletedIndex = docsIndex.findIndex(item => item.id === doc.id);
                localStorage.removeItem(docKey(doc.id));
                docsIndex = docsIndex.filter(item => item.id !== doc.id);
                writeDocsIndex();
                const nextDoc = docsIndex[Math.max(0, deletedIndex - 1)] || docsIndex[0];
                setActiveDocument(nextDoc.id);
                textarea.value = getDocumentContent(activeDocId);
            }
            renderDocumentSelect();
            clearPreviewRenderTimers();
            renderMarkdown({ force: true });
        }

        // Load saved content on page open
        loadFromStorage();
        renderMarkdown({ force: true });

        // Throttle saves to at most once every 5s while typing.
        let saveTimer = null;
        function scheduleSave() {
            if (saveTimer) return;
            saveTimer = setTimeout(function() {
                saveTimer = null;
                saveToStorage();
            }, 5000);
        }

        function flushPendingSave() {
            if (saveTimer) { clearTimeout(saveTimer); saveTimer = null; }
            saveToStorage();
        }

        textarea.addEventListener('input', function() {
            scheduleSave();
            schedulePreviewRender();
        });

        textarea.addEventListener('blur', flushPendingSave);

        window.addEventListener('beforeunload', flushPendingSave);

        // Preview rendering is dirty-driven: render shortly after typing pauses,
        // but at least every 5s during continuous edits. Unchanged content is skipped.

        // Double-click the draft selector to rename the current draft.
        documentSelect.addEventListener('dblclick', function(e) {
            e.preventDefault();
            renameDocument();
        });

        const LIGHT_CSS = `
            body{font-family:'Cormorant Garamond',Georgia,serif;max-width:720px;margin:48px auto;padding:0 24px;color:#1a1a1a;line-height:1.9;background:#faf8f5;}
            h1{font-size:2.5em;font-weight:700;margin:0 0 0.5em;letter-spacing:-0.03em;}
            h2{font-size:1.6em;font-weight:600;margin:2em 0 0.75em;padding-bottom:0.5em;border-bottom:1px solid #e8e4dd;}
            h3{font-family:'Outfit',sans-serif;font-size:1.1em;font-weight:600;margin:1.75em 0 0.75em;letter-spacing:0.02em;}
            p{font-size:1.1em;margin:1em 0;text-align:justify;}
            a{color:#c45c3e;text-decoration:none;border-bottom:1px solid currentColor;}
            code{font-family:'JetBrains Mono',monospace;font-size:0.85em;background:#f5f2ed;padding:3px 8px;border-radius:3px;color:#9a3d25;border:1px solid #e8e4dd;}
            pre{background:#1a1a1a;color:#f5f2ed;padding:24px;border-radius:4px;overflow-x:auto;margin:1.5em 0;line-height:1.6;border-top:3px solid #c45c3e;}

            table{width:100%;border-collapse:collapse;margin:1.5em 0;font-family:'Outfit',sans-serif;font-size:0.9em;}
            th{background:#f5f2ed;padding:14px 16px;text-align:left;font-weight:600;border-bottom:2px solid #1a1a1a;}
            td{padding:14px 16px;border-bottom:1px solid #e8e4dd;}

        const DARK_CSS = `
            body{font-family:'Cormorant Garamond',Georgia,serif;max-width:720px;margin:48px auto;padding:0 24px;color:#f1eee8;line-height:1.9;background:#11100f;}

            h2{font-size:1.6em;font-weight:600;margin:2em 0 0.75em;padding-bottom:0.5em;border-bottom:1px solid #332f2b;color:#f1eee8;}
            h3{font-family:'Outfit',sans-serif;font-size:1.1em;font-weight:600;margin:1.75em 0 0.75em;letter-spacing:0.02em;color:#f1eee8;}
            p{font-size:1.1em;margin:1em 0;text-align:justify;color:#f1eee8;}
            a{color:#e1785d;text-decoration:none;border-bottom:1px solid currentColor;}
            code{font-family:'JetBrains Mono',monospace;font-size:0.85em;background:#191715;padding:3px 8px;border-radius:3px;color:#ff9a7f;border:1px solid #332f2b;}

            blockquote{font-style:italic;color:#b2aaa1;border-left:3px solid #e1785d;padding-left:24px;margin:1.5em 0;}
            ul,ol{margin:1em 0;padding-left:1.5em;}
            li{margin:0.5em 0;color:#f1eee8;}

            th{background:#191715;padding:14px 16px;text-align:left;font-weight:600;border-bottom:2px solid #f1eee8;color:#f1eee8;}
            td{padding:14px 16px;border-bottom:1px solid #332f2b;color:#f1eee8;}
            hr{border:none;height:1px;background:#332f2b;margin:3em 0;}

        const PDF_PALETTES = {
            light: {
                paper: '#faf8f5',
                ink: '#1a1a1a',
                cream: '#f5f2ed',
                stone: '#e8e4dd',
                graphite: '#6b6b6b',
                rust: '#c45c3e',
                deepRust: '#9a3d25',
                codeBg: '#1a1a1a',
                codeText: '#f5f2ed'
            },
            dark: {
                paper: '#11100f',
                ink: '#f1eee8',
                cream: '#191715',
                stone: '#332f2b',
                graphite: '#b2aaa1',
                rust: '#e1785d',
                deepRust: '#ff9a7f',
                codeBg: '#080807',
                codeText: '#f4efe6'
            }
        };

        function getExportCss() {
            return getCurrentTheme() === 'dark' ? DARK_CSS : LIGHT_CSS;
        }

        function getPdfPalette() {
            return PDF_PALETTES[getCurrentTheme()];
        }

        function exportMD() {
            const blob = new Blob([textarea.value], {type: 'text/markdown'});
            triggerDownload(URL.createObjectURL(blob), 'document.md');
        }

        async function exportHTML() {
            await flushPreviewRender();
            const html = '<!DOCTYPE html>\n<html lang="en">\n<head>\n' +
                '  <meta charset="UTF-8">\n' +
                '  <meta name="viewport" content="width=device-width, initial-scale=1.0">\n' +
                '  <title>Document</title>\n' +
                '  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;0,700;1,400&family=JetBrains+Mono:wght@400&family=Outfit:wght@400;600&display=swap" rel="stylesheet">\n' +
                '  <style>' + getExportCss() + '</style>\n' +
                '</head>\n<body>\n' + preview.innerHTML + '\n</body>\n</html>';
            const blob = new Blob([html], {type: 'text/html'});
            triggerDownload(URL.createObjectURL(blob), 'document.html');
        }

        async function exportPDF() {
            await flushPreviewRender();
            const palette = getPdfPalette();
            // Create container at left edge for proper capture
            const wrapper = document.createElement('div');
            wrapper.style.cssText = 'position:fixed;top:0;left:0;z-index:9999;overflow:visible;';

            const clone = document.createElement('div');
            clone.style.cssText = 'width:800px;padding:48px;background:' + palette.paper + ';color:' + palette.ink + ';line-height:1.8;box-sizing:border-box;';

            const styleEl = document.createElement('style');
            styleEl.textContent = `
                .pdf-content * { box-sizing: border-box; }
                .pdf-content { font-family: Georgia, "Times New Roman", serif; font-size: 12pt; }
                .pdf-content h1 { font-size: 24pt; font-weight: 700; margin: 0 0 12pt; color: ${palette.ink}; }
                .pdf-content h2 { font-size: 18pt; font-weight: 600; margin: 24pt 0 12pt; padding-bottom: 6pt; border-bottom: 1px solid ${palette.stone}; color: ${palette.ink}; }
                .pdf-content h3 { font-size: 14pt; font-weight: 600; margin: 18pt 0 8pt; color: ${palette.ink}; }
                .pdf-content p { font-size: 12pt; margin: 10pt 0; color: ${palette.ink}; }
                .pdf-content a { color: ${palette.rust}; text-decoration: none; }
                .pdf-content code { font-family: "Courier New", monospace; font-size: 10pt; background: ${palette.cream}; padding: 2pt 5pt; border-radius: 2pt; color: ${palette.deepRust}; }
                .pdf-content pre { background: ${palette.codeBg}; color: ${palette.codeText}; padding: 12pt; border-radius: 4pt; margin: 12pt 0; overflow-x: auto; white-space: pre-wrap; word-wrap: break-word; }
                .pdf-content pre code { background: none; color: inherit; padding: 0; }
                .pdf-content blockquote { font-style: italic; color: ${palette.graphite}; border-left: 3pt solid ${palette.rust}; padding-left: 12pt; margin: 12pt 0; }
                .pdf-content ul, .pdf-content ol { margin: 10pt 0; padding-left: 20pt; }
                .pdf-content li { margin: 5pt 0; }
                .pdf-content table { width: 100%; border-collapse: collapse; margin: 12pt 0; font-size: 11pt; }
                .pdf-content th { background: ${palette.cream}; padding: 8pt 10pt; text-align: left; font-weight: 600; border-bottom: 2pt solid ${palette.ink}; color: ${palette.ink}; }
                .pdf-content td { padding: 8pt 10pt; border-bottom: 1pt solid ${palette.stone}; color: ${palette.ink}; }
                .pdf-content hr { border: none; height: 1pt; background: ${palette.stone}; margin: 20pt 0; }
                .pdf-content img { max-width: 100%; height: auto; }
            `;
            wrapper.appendChild(styleEl);

            const content = document.createElement('div');
            content.className = 'pdf-content';
            content.innerHTML = preview.innerHTML;
            clone.appendChild(content);

            wrapper.appendChild(clone);
            document.body.appendChild(wrapper);

            // Wait for render, then generate PDF
            setTimeout(function() {
                html2pdf().set({
                    margin: [10, 10, 10, 10],
                    filename: 'document.pdf',
                    image: { type: 'jpeg', quality: 0.98 },
                    html2canvas: {
                        scale: 2,
                        useCORS: true,
                        backgroundColor: palette.paper,
                        logging: false,
                        x: 0,
                        y: 0,
                        scrollX: 0,
                        scrollY: 0
                    },
                    jsPDF: { unit: 'mm', format: 'a4', orientation: 'portrait' },
                    pagebreak: { mode: 'css', avoid: ['pre', 'blockquote', 'tr'] }
                }).from(clone).save().then(function() {
                    document.body.removeChild(wrapper);
                }).catch(function(err) {
                    console.error('PDF export error:', err);
                    document.body.removeChild(wrapper);
                    alert('PDF export failed. Try exporting as HTML instead.');
                });
            }, 200);
        }

        function triggerDownload(url, filename) {
            const a = document.createElement('a');
            a.href = url;
            a.download = filename;
            a.style.display = 'none';
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);
        }
    </script>
</body>
</html>
